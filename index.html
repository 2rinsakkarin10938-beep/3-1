<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Arena Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111318",
              panel: "#1b2130",
              panelAlt: "#232c40",
              accent: "#f2a93b",
              danger: "#ef5b5b",
              mint: "#67d5b5",
            },
            boxShadow: {
              pixel: "0 0 0 2px #0b0e13, 6px 6px 0 0 #0b0e13",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/game.css" />
  </head>
  <body class="min-h-screen bg-ink text-slate-100">
    <div class="page-shell min-h-screen px-4 py-6 md:px-8">
      <div class="mx-auto flex min-h-[calc(100vh-3rem)] max-w-7xl flex-col gap-4">
        <header class="panel flex items-center justify-between gap-4 px-5 py-4">
          <div>
            <p class="pixel-title text-accent">Pixel Arena</p>
            <p class="mt-2 text-sm text-slate-300">
              Top-down local multiplayer prototype
            </p>
          </div>
          <div class="text-right text-xs text-slate-400">
            <p>Player 1: WASD + Shift + 1-4</p>
            <p>Player 2: Arrows + Enter + U I O P</p>
          </div>
        </header>

        <main class="grid flex-1 gap-4 lg:grid-cols-[380px_minmax(0,1fr)]">
          <section class="panel overflow-hidden">
            <div id="screen-root" class="h-full"></div>
          </section>

          <section class="panel relative overflow-hidden">
            <div
              id="canvas-shell"
              class="hidden h-full min-h-[480px] flex-col gap-3 p-4"
            >
              <div
                id="game-hud"
                class="grid gap-3 md:grid-cols-[minmax(0,1fr)_260px]"
              ></div>
              <div class="canvas-frame flex-1 overflow-hidden">
                <canvas
                  id="game-canvas"
                  width="960"
                  height="640"
                  class="h-full w-full"
                ></canvas>
              </div>
            </div>

            <div
              id="preview-panel"
              class="flex h-full min-h-[480px] items-center justify-center p-6 text-center text-slate-300"
            >
              <div class="max-w-md">
                <p class="pixel-title text-lg text-mint">Lobby Preview</p>
                <p class="mt-4 text-sm leading-7 text-slate-300">
                  Start from the lobby, create a character, open a room, and launch a
                  same-screen match. The game canvas replaces this panel when the room
                  starts.
                </p>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
