services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      CORS_ORIGIN: https://${APP_DOMAIN}

volumes:
  caddy_data:
  caddy_config:
