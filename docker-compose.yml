services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      CORS_ORIGIN: https://${APP_DOMAIN}

volumes:
  caddy_data:
  caddy_config:
