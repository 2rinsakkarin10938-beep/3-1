name: Deploy

on:
  push:
    branches: [main]

env:
  PROJECT_NAME: gamev1
  APP_DOMAIN: gamev1.apichart.dev
  WEB_HTTP_PORT: 8080
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,PROJECT_NAME,APP_DOMAIN,WEB_HTTP_PORT
          script: |
            set -e
            PROJECT_DIR="$HOME/$PROJECT_NAME"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git pull origin main
            export PROJECT_NAME APP_DOMAIN WEB_HTTP_PORT
            docker compose --project-name "$PROJECT_NAME" up -d --build --force-recreate --remove-orphans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
